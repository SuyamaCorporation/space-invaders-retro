<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>スペースインベーダーリトロ</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen p-4 flex flex-col items-center">
<h1 class="text-2xl font-bold text-green-400 mb-1">スペースインベーダーリトロ</h1>
<div class="flex gap-6 mb-2 text-sm">
  <span>スコア: <span id="score" class="text-green-300 font-bold">0</span></span>
  <span>ハイスコア: <span id="hi" class="text-green-300 font-bold">0</span></span>
  <span>レベル: <span id="level" class="text-yellow-300 font-bold">1</span></span>
  <span>残機: <span id="lives" class="text-red-400 font-bold">❤❤❤</span></span>
</div>
<canvas id="c" aria-label="スペースインベーダーゲームフィールド" class="border border-gray-700 rounded bg-black"></canvas>
<div id="overlay" class="hidden mt-4 text-center">
  <p id="overlayMsg" class="text-2xl font-bold text-green-300 mb-3"></p>
  <button onclick="initGame()" aria-label="ゲームを再開する" class="bg-green-700 hover:bg-green-600 text-white font-bold py-2 px-8 rounded-full">もう一度</button>
</div>
<p class="mt-2 text-gray-500 text-xs">←→で移動 | スペース/Zで発射</p>

<script>
const C = document.getElementById("c");
const ctx = C.getContext("2d");
const W = 480, H = 520;
C.width = W; C.height = H;

let player, invaders, bullets, enemyBullets, shields, score, lives, level, gameOver, raf;
let invaderDir = 1, invaderDrop = false, invaderTick = 0;
let hiScore = parseInt(localStorage.getItem("invaders_hi")||"0");
document.getElementById("hi").textContent = hiScore;

const ROWS=3, COLS=8, INV_W=40, INV_H=28;

function initGame() {
  document.getElementById("overlay").classList.add("hidden");
  score=0; lives=3; level=1; gameOver=false;
  player = {x:W/2-20, y:H-50, w:40, h:24, speed:4};
  initInvaders(); initShields(); bullets=[]; enemyBullets=[];
  invaderDir=1; invaderTick=0;
  keys = {};
  updateUI();
  if(raf) cancelAnimationFrame(raf);
  loop();
}

function initInvaders() {
  invaders = [];
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) {
    invaders.push({x:60+c*50, y:60+r*44, alive:true, r, c, anim:0});
  }
  invaderDir = 1;
}

function initShields() {
  shields = [];
  for(let i=0;i<4;i++) {
    const bx = 60 + i*100;
    for(let r=0;r<3;r++) for(let c=0;c<5;c++) {
      shields.push({x:bx+c*10, y:H-130+r*10, w:10, h:10, hp:3});
    }
  }
}

let keys = {};
document.addEventListener("keydown", e=>{
  keys[e.code]=true;
  if(["Space","ArrowLeft","ArrowRight","KeyZ"].includes(e.code)) e.preventDefault();
  if((e.code==="Space"||e.code==="KeyZ") && !gameOver) {
    if(bullets.filter(b=>b.fromPlayer).length < 2)
      bullets.push({x:player.x+player.w/2-2,y:player.y,w:4,h:12,vy:-10,fromPlayer:true});
  }
});
document.addEventListener("keyup", e=>{ keys[e.code]=false; });

let tick=0;
function loop() {
  tick++;
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);

  if(!gameOver) {
    // Move player
    if((keys["ArrowLeft"]||keys["KeyA"]) && player.x>0) player.x-=player.speed;
    if((keys["ArrowRight"]||keys["KeyD"]) && player.x+player.w<W) player.x+=player.speed;

    // Move invaders
    invaderTick++;
    const speed = Math.max(2, 20 - level*2 - Math.floor((ROWS*COLS-invaders.filter(i=>i.alive).length)/4));
    if(invaderTick >= speed) {
      invaderTick=0;
      let hitWall=false;
      const alive = invaders.filter(i=>i.alive);
      alive.forEach(inv=>{ inv.x += invaderDir*12; inv.anim^=1; });
      alive.forEach(inv=>{ if(inv.x<=10||inv.x+INV_W>=W-10) hitWall=true; });
      if(hitWall) {
        invaderDir *= -1;
        alive.forEach(inv=>{ inv.y+=20; });
      }
      // Enemy shoot
      if(alive.length && Math.random()<0.15) {
        const shooter = alive[Math.floor(Math.random()*alive.length)];
        if(enemyBullets.length<4)
          enemyBullets.push({x:shooter.x+INV_W/2-2,y:shooter.y+INV_H,w:4,h:12,vy:5});
      }
      // Check if invaders reached player level
      if(alive.some(i=>i.y+INV_H>=player.y)) { lives=0; endGame("ゲームオーバー"); return; }
    }

    // Move bullets
    bullets = bullets.filter(b=>b.y>-20 && b.y<H+20);
    enemyBullets = enemyBullets.filter(b=>b.y<H+20);
    bullets.forEach(b=>{ b.y+=b.vy; });
    enemyBullets.forEach(b=>{ b.y+=b.vy; });

    // Player bullet hits invader
    bullets.filter(b=>b.fromPlayer).forEach(pb=>{
      invaders.filter(i=>i.alive).forEach(inv=>{
        if(pb.x<inv.x+INV_W&&pb.x+pb.w>inv.x&&pb.y<inv.y+INV_H&&pb.y+pb.h>inv.y) {
          inv.alive=false; pb.y=-999; score+=10; updateUI();
        }
      });
    });

    // Enemy bullet hits player
    enemyBullets.forEach(eb=>{
      if(eb.x<player.x+player.w&&eb.x+eb.w>player.x&&eb.y<player.y+player.h&&eb.y+eb.h>player.y) {
        eb.y=9999; lives--; updateUI();
        if(lives<=0){endGame("ゲームオーバー"); return;}
      }
    });

    // Bullets hit shields
    [...bullets,...enemyBullets].forEach(b=>{
      shields.forEach(s=>{
        if(s.hp>0&&b.x<s.x+s.w&&b.x+b.w>s.x&&b.y<s.y+s.h&&b.y+b.h>s.y) {
          s.hp--; b.y=-999;
        }
      });
    });

    // Level clear
    if(invaders.every(i=>!i.alive)) {
      level++; updateUI(); initInvaders(); initShields(); bullets=[]; enemyBullets=[];
    }
  }

  // Draw
  drawShields(); drawInvaders(); drawPlayer(); drawBullets();

  // HUD line
  ctx.strokeStyle="#1f4f1f"; ctx.beginPath(); ctx.moveTo(0,H-45); ctx.lineTo(W,H-45); ctx.stroke();

  if(!gameOver) raf = requestAnimationFrame(loop);
}

function drawPlayer() {
  ctx.fillStyle="#22c55e";
  ctx.fillRect(player.x+14,player.y,12,6);
  ctx.fillRect(player.x,player.y+6,player.w,18);
}

function drawInvaders() {
  invaders.filter(i=>i.alive).forEach(inv=>{
    ctx.fillStyle = inv.r===0?"#f472b6":inv.r===1?"#60a5fa":"#4ade80";
    if(inv.anim===0) {
      // Frame A
      ctx.fillRect(inv.x+8,inv.y,24,4);
      ctx.fillRect(inv.x+4,inv.y+4,32,16);
      ctx.fillRect(inv.x,inv.y+8,8,8);
      ctx.fillRect(inv.x+32,inv.y+8,8,8);
      ctx.fillRect(inv.x+4,inv.y+20,12,6);
      ctx.fillRect(inv.x+24,inv.y+20,12,6);
    } else {
      ctx.fillRect(inv.x+8,inv.y,24,4);
      ctx.fillRect(inv.x+4,inv.y+4,32,16);
      ctx.fillRect(inv.x+2,inv.y+10,6,8);
      ctx.fillRect(inv.x+32,inv.y+10,6,8);
      ctx.fillRect(inv.x+8,inv.y+20,8,6);
      ctx.fillRect(inv.x+24,inv.y+20,8,6);
    }
    // Eyes
    ctx.fillStyle="#000";
    ctx.fillRect(inv.x+10,inv.y+8,6,4);
    ctx.fillRect(inv.x+24,inv.y+8,6,4);
  });
}

function drawBullets() {
  ctx.fillStyle="#22c55e";
  bullets.filter(b=>b.fromPlayer).forEach(b=>ctx.fillRect(b.x,b.y,b.w,b.h));
  ctx.fillStyle="#f87171";
  enemyBullets.forEach(b=>{
    ctx.fillRect(b.x,b.y,b.w,4);
    ctx.fillRect(b.x,b.y+8,b.w,4);
  });
}

function drawShields() {
  shields.filter(s=>s.hp>0).forEach(s=>{
    const g = Math.floor((s.hp/3)*180)+40;
    ctx.fillStyle=`rgb(0,${g},0)`;
    ctx.fillRect(s.x,s.y,s.w,s.h);
  });
}

function updateUI() {
  document.getElementById("score").textContent = score;
  document.getElementById("level").textContent = level;
  document.getElementById("lives").textContent = "❤".repeat(Math.max(0,lives));
}

function endGame(msg) {
  gameOver=true;
  if(score>hiScore){hiScore=score;localStorage.setItem("invaders_hi",hiScore);document.getElementById("hi").textContent=hiScore;}
  document.getElementById("overlayMsg").textContent = msg;
  document.getElementById("overlay").classList.remove("hidden");
}

initGame();
</script>
</body>
</html>
